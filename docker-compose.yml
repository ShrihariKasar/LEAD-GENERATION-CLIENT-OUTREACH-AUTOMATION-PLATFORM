version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: threadline-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: threadline_db
      POSTGRES_USER: threadline_user
      POSTGRES_PASSWORD: threadline_pass
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U threadline_user -d threadline_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: threadline-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: threadline-backend
    restart: unless-stopped
    environment:
      - DATABASE_URL=postgresql+asyncpg://threadline_user:threadline_pass@postgres:5432/threadline_db
      - REDIS_URL=redis://redis:6379/0
      - ENVIRONMENT=production
      - DEBUG=False
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: threadline-frontend
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  postgres_data:
  redis_data:
